{{- if .Capabilities.APIVersions.Has "networking.istio.io/v1beta1" }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "kyma-env-broker.fullname" . }}
spec:
  gateways:
    - {{ .Values.global.istio.gateway | required "Please specify .global.istio.gateway"}}
    {{- if .Values.global.istio.additionalGateways }}
    {{ toYaml .Values.global.istio.additionalGateways | nindent 4 }}
    {{- end }}
  hosts:
  - {{ .Values.host }}.{{ .Values.global.ingress.domainName }}
  http:
  - match:
    - uri:
        regex: /oauth/([^/]+/)?v2/.*
    route:
    - destination:
        host: {{ include "kyma-env-broker.fullname" . }}
        port:
          number: 80
  - match:
    - uri:
        regex: /upgrade/.*
    route:
    - destination:
        host: {{ include "kyma-env-broker.fullname" . }}
        port:
          number: 80
  - match:
    - uri:
        regex: /orchestrations.*
    route:
    - destination:
        host: {{ include "kyma-env-broker.fullname" . }}
        port:
          number: 80
  - corsPolicy:
      allowHeaders:
        - Authorization
        - Content-Type
      allowMethods: ["GET"]
      allowOrigins:
      - exact: {{ .Values.corsPolicy.allowOrigin | quote }}
    match:
      - uri:
          regex: /runtimes
    route:
      - destination:
          host: {{ include "kyma-env-broker.fullname" . }}
          port:
            number: 80
  - corsPolicy:
      allowHeaders:
        - Authorization
        - Content-Type
      allowMethods: ["GET"]
      allowOrigins:
      - exact: {{ .Values.corsPolicy.allowOrigin | quote }}
    match:
      - uri:
          regex: /events
    route:
      - destination:
          host: {{ include "kyma-env-broker.fullname" . }}
          port:
            number: 80
  - corsPolicy:
      allowHeaders:
        - Authorization
        - Content-Type
      allowMethods: ["GET"]
      allowOrigins:
        - exact: {{ .Values.corsPolicy.allowOrigin | quote }}
    match:
      - uri:
          regex: /version
    route:
      - destination:
          host: {{ include "kyma-env-broker.fullname" . }}
          port:
            number: 80
  # kubeconfig endpoint exposed without authorization; CORS handled at application level
  - match:
      - uri:
          regex: /kubeconfig/.*
    route:
      - destination:
          host: {{ include "kyma-env-broker.fullname" . }}
          port:
            number: 80
  {{- if .Values.swagger.virtualService.enabled }}
  # swagger exposed without authorization on root endpoint also needs access to static resources placed under /swagger folder
  - corsPolicy:
      allowHeaders:
        - Authorization
        - Content-Type
      allowMethods: ["GET"]
      allowOrigins:
      - exact: {{ .Values.corsPolicy.allowOrigin | quote }}
    match:
      - uri:
          exact: /
    route:
      - destination:
          host: {{ include "kyma-env-broker.fullname" . }}
          port:
            number: 80
  - corsPolicy:
      allowHeaders:
        - Authorization
        - Content-Type
      allowMethods: ["GET"]
      allowOrigins:
      - exact: {{ .Values.corsPolicy.allowOrigin | quote }}
    match:
      - uri:
          regex: /swagger.*
    route:
      - destination:
          host: {{ include "kyma-env-broker.fullname" . }}
          port:
            number: 80
  - corsPolicy:
      allowHeaders:
        - Authorization
        - Content-Type
      allowMethods: ["GET"]
      allowOrigins:
      - exact: {{ .Values.corsPolicy.allowOrigin | quote }}
    match:
      - uri:
          regex: /schema.*
    route:
      - destination:
          host: {{ include "kyma-env-broker.fullname" . }}
          port:
            number: 80
  {{ end }}
{{- end }}
